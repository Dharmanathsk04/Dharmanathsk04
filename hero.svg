<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Dharmanath Kadam — Java Full Stack Developer">
<title>Dharmanath Kadam — Java Full Stack Developer</title>
<defs>
  <style>
    .sg{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
    .sgm{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
    .jb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .jbb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:700}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes role{0%{opacity:0;transform:translateY(16px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}25.5%{opacity:0;transform:translateY(-16px)}100%{opacity:0;transform:translateY(-16px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,26px)}}
    @keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(420px)}}
    @keyframes eyeBlink{0%,85%,100%{transform:scaleY(1)}90%{transform:scaleY(0.1)}}
    .fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
    .fi{animation:fadeIn .7s ease both}
    .role{animation:role 12s cubic-bezier(.2,.8,.2,1) infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    .blob{animation:drift 14s ease-in-out infinite alternate}
    .blob2{animation:drift2 16s ease-in-out infinite alternate}
    .float{animation:float 3.5s ease-in-out infinite}
    .corner{stroke-dasharray:60;animation:draw .8s ease both}
    .scanline{animation:scan 4s linear infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:eyeBlink 4.5s infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-.35 0;.35 0;-.35 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="nameG2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#171a2c"/><stop offset="1" stop-color="#121423"/>
  </linearGradient>
  <linearGradient id="edgeG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset=".5" stop-color="#262a42"/><stop offset="1" stop-color="#f472b6" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4c9a0"/><stop offset="1" stop-color="#d9a273"/>
  </linearGradient>
  <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b1a0f"/><stop offset="1" stop-color="#1a0f08"/>
  </linearGradient>
  <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/>
  </linearGradient>
  <linearGradient id="screenG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1e1a"/><stop offset="1" stop-color="#06100e"/>
  </linearGradient>
  <linearGradient id="deskG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1e2436"/><stop offset="1" stop-color="#12161f"/>
  </linearGradient>
  <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowP" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".3"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="13" r=".9" fill="#ffffff" fill-opacity=".06"/>
  </pattern>
  <filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="card"><rect width="1280" height="540" rx="26"/></clipPath>
  <clipPath id="hiClip"><rect x="60" y="130" width="330" height="46"><animate attributeName="width" values="0;0;330" keyTimes="0;.4167;1" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1"/></rect></clipPath>
  <clipPath id="nameClip"><rect x="50" y="170" width="600" height="100"><animate attributeName="y" values="262;262;170" keyTimes="0;.5263;1" dur="1.9s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1"/></rect></clipPath>
  <clipPath id="screenClip"><rect x="1010" y="150" width="170" height="140" rx="5"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <!-- Background -->
  <rect width="1280" height="540" fill="url(#cardG)"/>
  <rect width="1280" height="540" fill="url(#dots)"/>

  <!-- Ambient blobs -->
  <g filter="url(#blur60)" opacity=".55">
    <circle class="blob" cx="170" cy="120" r="150" fill="#22d3ee" fill-opacity=".22"/>
    <circle class="blob2" cx="470" cy="470" r="170" fill="#a78bfa" fill-opacity=".22"/>
    <circle class="blob" cx="1150" cy="80" r="130" fill="#f472b6" fill-opacity=".14"/>
  </g>

  <!-- ═══ RIGHT: PREMIUM WORKSPACE SCENE ═══ -->
  <g class="fu" style="animation-delay:.4s">

    <!-- Wall glows -->
    <ellipse cx="990" cy="330" rx="300" ry="180" fill="url(#glowG)"/>
    <ellipse cx="1040" cy="160" rx="180" ry="130" fill="url(#glowP)"/>

    <!-- Wall clock -->
    <g transform="translate(1210, 130)" opacity=".85">
      <circle r="20" fill="#0f1420" stroke="#262a42" stroke-width="2"/>
      <circle r="17" fill="none" stroke="#22d3ee" stroke-opacity=".25" stroke-width=".8"/>
      <circle r="2" fill="#22d3ee"/>
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#eceef6" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="8" y2="4" stroke="#eceef6" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Chair back (subtle) -->
    <ellipse cx="935" cy="330" rx="85" ry="105" fill="#12161f" opacity=".85"/>

    <!-- Boy body / hoodie -->
    <path d="M885 265 Q872 250 895 242 L985 242 Q1008 250 995 265 L1005 435 L875 435 Z" fill="url(#shirtG)"/>
    <!-- Hoodie hood V -->
    <path d="M905 242 Q940 232 975 242 L968 285 Q940 272 912 285 Z" fill="#1e40af" opacity=".65"/>
    <!-- Hood strings -->
    <circle cx="920" cy="272" r="2.5" fill="#fff" opacity=".9"/>
    <circle cx="960" cy="272" r="2.5" fill="#fff" opacity=".9"/>

    <!-- Neck -->
    <rect x="918" y="225" width="44" height="28" rx="9" fill="#d9a273"/>

