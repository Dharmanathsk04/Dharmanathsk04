    <stop offset=".5" stop-color="#262a42"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity=".6"/>
  </linearGradient>
  <pattern id="dots3" width="24" height="24" patternUnits="userSpaceOnUse">
