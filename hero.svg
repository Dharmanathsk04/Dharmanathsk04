<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Dharmanath Kadam — Java Full Stack Developer">
<title>Dharmanath Kadam — Java Full Stack Developer</title>
<desc>Animated hero: Dharmanath walks in, waves, next to his name, cycling roles and details.</desc>
<defs>
  <style>
    .sg{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
    .sgm{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
    .jb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .jbb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:700}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes ring{0%{r:4;opacity:.8}100%{r:13;opacity:0}}
    .fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
    .fi{animation:fadeIn .7s ease both}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}

    .role{animation:role 12s cubic-bezier(.2,.8,.2,1) infinite}
    @keyframes role{0%{opacity:0;transform:translateY(16px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}25.5%{opacity:0;transform:translateY(-16px)}100%{opacity:0;transform:translateY(-16px)}}
    .blob{animation:drift 14s ease-in-out infinite alternate}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
    .blob2{animation:drift2 16s ease-in-out infinite alternate}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,26px)}}
    .corner{stroke-dasharray:60;animation:draw .8s ease both}
    @keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}

    /* Boy character animations */
    .walk-in{animation:walkin 1.8s cubic-bezier(.3,1,.4,1) forwards}
    @keyframes walkin{0%{transform:translateX(-120px);opacity:0}40%{opacity:1}100%{transform:translateX(0);opacity:1}}
    .wave-arm{transform-box:fill-box;transform-origin:top left;animation:wave 1.2s ease-in-out 1.6s infinite}
    @keyframes wave{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(-55deg)}}
    .blink{animation:blink 4.5s infinite}
    @keyframes blink{0%,85%,100%{transform:scaleY(1)}90%{transform:scaleY(0.1)}}
    .code-line{opacity:0;animation:codetype 4s steps(1) infinite}
    @keyframes codetype{0%{opacity:0}10%{opacity:1}100%{opacity:1}}
    .cursor{animation:cursorblink .9s steps(1) infinite}
    @keyframes cursorblink{0%,50%{opacity:1}51%,100%{opacity:0}}
  </style>
  <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-.35 0;.35 0;-.35 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="nameG2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000"/><stop offset=".26" stop-color="#fff"/><stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a2456"/><stop offset="1" stop-color="#0a0e24"/>
  </linearGradient>
  <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4c9a0"/><stop offset="1" stop-color="#d9a273"/>
  </linearGradient>
  <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b1a0f"/><stop offset="1" stop-color="#1a0f08"/>
  </linearGradient>
  <linearGradient id="hoodieG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/>
  </linearGradient>
  <linearGradient id="deskG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a3142"/><stop offset="1" stop-color="#151a26"/>
  </linearGradient>
  <radialGradient id="warmGlow" cx=".5" cy=".7" r=".6">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".4"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <mask id="vmask" maskUnits="userSpaceOnUse" x="560" y="0" width="724" height="540">
    <rect x="560" y="0" width="724" height="540" fill="url(#fadeL)"/>
  </mask>
  <mask id="vmaskB" maskUnits="userSpaceOnUse" x="560" y="0" width="724" height="540">
    <rect x="560" y="0" width="724" height="540" fill="url(#fadeB)"/>
  </mask>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r=".9" fill="#ffffff" fill-opacity=".06"/></pattern>
  <filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="card"><rect width="1280" height="540" rx="26"/></clipPath>
  <clipPath id="hiClip"><rect x="60" y="130" width="330" height="46"><animate attributeName="width" values="0;0;330" keyTimes="0;.4167;1" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1"/></rect></clipPath>
  <clipPath id="nameClip"><rect x="50" y="170" width="560" height="100"><animate attributeName="y" values="262;262;170" keyTimes="0;.5263;1" dur="1.9s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1"/></rect></clipPath>
  <clipPath id="videoClip"><rect x="760" y="60" width="460" height="380" rx="16"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1280" height="540" fill="#0d0e16"/>
  <rect width="1280" height="540" fill="url(#dots)"/>
  <g filter="url(#blur60)" opacity=".55">
    <circle class="blob" cx="170" cy="120" r="150" fill="#22d3ee" fill-opacity=".22"/>
    <circle class="blob2" cx="470" cy="470" r="170" fill="#a78bfa" fill-opacity=".22"/>
    <circle class="blob" cx="1150" cy="80" r="130" fill="#f472b6" fill-opacity=".14"/>
  </g>

  <!-- ═══ VIDEO FRAME (Boy Developer Scene) ═══ -->
  <g mask="url(#vmask)"><g mask="url(#vmaskB)">

    <!-- Video background - dark studio -->
    <rect x="760" y="60" width="460" height="380" fill="url(#skyG)"/>

    <!-- Wall with subtle grid -->
    <g opacity=".15" stroke="#22d3ee" stroke-width=".6">
      <line x1="760" y1="140" x2="1220" y2="140"/>
      <line x1="760" y1="200" x2="1220" y2="200"/>
      <line x1="760" y1="260" x2="1220" y2="260"/>
      <line x1="760" y1="320" x2="1220" y2="320"/>
      <line x1="820" y1="60" x2="820" y2="440"/>
      <line x1="900" y1="60" x2="900" y2="440"/>
      <line x1="980" y1="60" x2="980" y2="440"/>
      <line x1="1060" y1="60" x2="1060" y2="440"/>
      <line x1="1140" y1="60" x2="1140" y2="440"/>
    </g>

    <!-- Neon glow behind -->
    <ellipse cx="990" cy="340" rx="220" ry="100" fill="url(#warmGlow)"/>

    <!-- Desk -->
    <rect x="760" y="360" width="460" height="80" fill="url(#deskG)"/>
    <rect x="760" y="360" width="460" height="4" fill="#22d3ee" opacity=".3"/>

    <!-- Monitor on desk (behind character) -->
    <g transform="translate(1080, 220)">
      <rect x="-120" y="0" width="240" height="150" rx="8" fill="#0a0e14" stroke="#262a42" stroke-width="1.5"/>
      <rect x="-112" y="8" width="224" height="128" rx="4" fill="#0b1e1a"/>
      <g font-family="ui-monospace,Menlo,monospace" font-size="9">
        <text x="-100" y="28" fill="#22d3ee" class="code-line" style="animation-delay:0s">public class Dev {</text>
        <text x="-92" y="44" fill="#fbbf24" class="code-line" style="animation-delay:.2s">  void build() {</text>
        <text x="-84" y="60" fill="#a78bfa" class="code-line" style="animation-delay:.4s">    Spring.run();</text>
        <text x="-84" y="76" fill="#34d399" class="code-line" style="animation-delay:.6s">    React.render();</text>
        <text x="-92" y="92" fill="#fbbf24" class="code-line" style="animation-delay:.8s">  }</text>
        <text x="-100" y="108" fill="#22d3ee" class="code-line" style="animation-delay:1s">}</text>
        <rect x="-84" y="118" width="6" height="10" fill="#22d3ee" class="cursor"/>
      </g>
      <!-- Monitor stand -->
      <rect x="-15" y="150" width="30" height="12" fill="#1a1f2e"/>
      <rect x="-40" y="162" width="80" height="6" rx="3" fill="#1a1f2e"/>
    </g>

    <!-- Boy Character (walking in and waving) -->
    <g class="walk-in" transform="translate(900, 60)">
      <g transform="translate(0, 180)">

        <!-- Shadow -->
        <ellipse cx="0" cy="132" rx="55" ry="8" fill="#000" opacity=".4"/>

        <!-- Body / hoodie -->
        <path d="M-55 130 L-50 20 Q-50 -10 -30 -20 L30 -20 Q50 -10 50 20 L55 130 Z" fill="url(#hoodieG)"/>
        <!-- Hoodie pocket -->
        <path d="M-30 50 L30 50 L28 90 L-28 90 Z" fill="#1e40af" opacity=".5"/>
        <!-- Hood strings -->
        <circle cx="-10" cy="-10" r="2.5" fill="#ffffff" opacity=".8"/>
        <circle cx="10" cy="-10" r="2.5" fill="#ffffff" opacity=".8"/>

        <!-- Neck -->
        <rect x="-12" y="-35" width="24" height="20" rx="6" fill="#d9a273"/>

        <!-- Head -->
        <g transform="translate(0, -70)">
          <!-- Hair back -->
          <path d="M-40 -8 Q-42 -50 -20 -65 Q0 -75 20 -65 Q42 -50 40 -8 Q35 -16 28 -18 L28 5 Q18 -3 0 -5 Q-18 -3 -28 5 L-28 -18 Q-35 -16 -40 -8 Z" fill="url(#hairG)"/>
          <!-- Face -->
          <ellipse cx="0" cy="0" rx="34" ry="40" fill="url(#skinG)"/>
          <!-- Hair front -->
          <path d="M-42 -20 Q-38 -50 -20 -62 Q0 -72 20 -62 Q38 -50 42 -20 Q28 -32 15 -30 Q0 -28 -15 -32 Q-28 -32 -42 -20 Z" fill="url(#hairG)"/>
          <!-- Fringe -->
          <path d="M-20 -50 Q-8 -58 14 -52 Q6 -42 0 -38 Q-10 -42 -20 -50 Z" fill="url(#hairG)"/>

          <!-- Ears -->
          <ellipse cx="-34" cy="0" rx="5" ry="8" fill="#d9a273"/>
          <ellipse cx="34" cy="0" rx="5" ry="8" fill="#d9a273"/>

          <!-- Eyebrows -->
          <path d="M-22 -12 Q-16 -15 -10 -12" stroke="#1a0f08" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M10 -12 Q16 -15 22 -12" stroke="#1a0f08" stroke-width="2" stroke-linecap="round" fill="none"/>

          <!-- Eyes (with blink) -->
          <g class="blink" style="transform-origin:center;transform-box:fill-box">
            <ellipse cx="-15" cy="-3" rx="4" ry="3.5" fill="#1a0f08"/>
            <ellipse cx="15" cy="-3" rx="4" ry="3.5" fill="#1a0f08"/>
            <circle cx="-14" cy="-4" r="1.2" fill="#ffffff" opacity=".9"/>
            <circle cx="16" cy="-4" r="1.2" fill="#ffffff" opacity=".9"/>
          </g>

          <!-- Nose -->
          <path d="M-2 8 Q0 12 2 8" stroke="#b8845a" stroke-width="1.4" stroke-linecap="round" fill="none"/>

          <!-- Friendly smile -->
          <path d="M-10 20 Q0 28 10 20" stroke="#8b5a3a" stroke-width="1.8" stroke-linecap="round" fill="none"/>

          <!-- Blush -->
          <ellipse cx="-22" cy="12" rx="5" ry="3" fill="#f472b6" opacity=".3"/>
          <ellipse cx="22" cy="12" rx="5" ry="3" fill="#f472b6" opacity=".3"/>
        </g>

        <!-- LEFT ARM (resting) -->
        <path d="M-52 0 Q-75 30 -70 70 Q-68 85 -58 88" fill="none" stroke="url(#hoodieG)" stroke-width="22" stroke-linecap="round"/>
        <ellipse cx="-58" cy="92" rx="10" ry="8" fill="#f4c9a0"/>

        <!-- RIGHT ARM (waving hi!) -->
        <g class="wave-arm">
          <path d="M52 0 Q80 -20 85 -60 Q88 -80 80 -95" fill="none" stroke="url(#hoodieG)" stroke-width="22" stroke-linecap="round"/>
          <ellipse cx="78" cy="-100" rx="10" ry="12" fill="#f4c9a0"/>
          <!-- Little fingers spread -->
          <line x1="70" y1="-108" x2="68" y2="-118" stroke="#f4c9a0" stroke-width="3" stroke-linecap="round"/>
          <line x1="78" y1="-112" x2="78" y2="-124" stroke="#f4c9a0" stroke-width="3" stroke-linecap="round"/>
          <line x1="86" y1="-108" x2="90" y2="-118" stroke="#f4c9a0" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Legs -->
        <rect x="-28" y="130" width="18" height="60" fill="#1e293b"/>
        <rect x="10" y="130" width="18" height="60" fill="#1e293b"/>
        <!-- Shoes -->
        <ellipse cx="-19" cy="192" rx="15" ry="6" fill="#0f172a"/>
        <ellipse cx="19" cy="192" rx="15" ry="6" fill="#0f172a"/>

        <!-- Speech bubble "Hi!" -->
        <g class="fu" style="animation-delay:2.2s">
          <rect x="60" y="-140" width="60" height="36" rx="14" fill="#22d3ee"/>
          <path d="M68 -105 L62 -95 L80 -104 Z" fill="#22d3ee"/>
          <text class="sg" x="90" y="-116" font-size="20" fill="#0a0e14" text-anchor="middle">Hi!</text>
        </g>
      </g>
    </g>

    <!-- Ambient sparkles around character -->
    <g fill="#22d3ee" opacity=".7">
      <circle cx="880" cy="140" r="2">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="180" r="2">
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin=".5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1050" cy="120" r="1.5" fill="#f472b6">
        <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="940" cy="200" r="1.5" fill="#a78bfa">
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

  </g></g>

  <!-- Viewfinder HUD -->
  <path class="corner" d="M760 74V40H794" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.3s"/>
  <path class="corner" d="M1236 74V40H1202" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.38s"/>
  <path class="corner" d="M760 466V500H794" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.46s"/>
  <path class="corner" d="M1236 466V500H1202" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.54s"/>

  <g class="fi" style="animation-delay:.6s">
    <circle cx="782" cy="483" r="5" fill="#ef4444"><animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text class="jbb" x="794" y="488" font-size="13" fill="#eceef6" letter-spacing="2">REC</text>
    <text class="jb" x="1222" y="488" font-size="12" fill="#8d93ab" text-anchor="end" letter-spacing="1.5">HELLO.MP4 &#183; 24FPS</text>
  </g>

  <!-- Scrub bar synced to video loop -->
  <g class="fi" style="animation-delay:.8s">
    <rect x="760" y="516" width="476" height="3" rx="1.5" fill="#ffffff" fill-opacity=".12"/>
    <rect x="760" y="516" width="0" height="3" rx="1.5" fill="url(#nameG2)">
      <animate attributeName="width" values="0;476" dur="4.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ═══ LEFT COPY ═══ -->
  <g class="fu" style="animation-delay:.2s">
    <rect x="64" y="64" width="240" height="32" rx="16" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/>
    <circle cx="84" cy="80" r="4.5" fill="#34d399"/>
    <circle cx="84" cy="80" r="4" fill="none" stroke="#34d399" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="jbb" x="98" y="85" font-size="12" fill="#34d399" letter-spacing="1.6">OPEN TO WORK</text>
  </g>

  <text clip-path="url(#hiClip)" class="sgm" x="64" y="164" font-size="30" fill="#eceef6">Hi there, I'm</text>

  <g clip-path="url(#nameClip)">
    <text class="sg" x="60" y="250" font-size="76" letter-spacing="-1.5" fill="url(#nameG)" filter="url(#glow)">Dharmanath</text>
  </g>
  <text class="sg fu" x="60" y="326" font-size="76" letter-spacing="-1.5" fill="url(#nameG)" filter="url(#glow)" style="animation-delay:1.8s">Kadam</text>

  <rect x="64" y="350" width="120" height="3" rx="1.5" fill="url(#nameG2)">
    <animate attributeName="width" values="0;0;120" keyTimes="0;.68;1" dur="2.5s" begin="0s" fill="freeze"/>
  </rect>

  <text class="jbb fi" x="64" y="402" font-size="21" fill="#22d3ee" style="animation-delay:1.8s">&gt;</text>
  <text class="role jb" x="92" y="402" font-size="21" fill="#eceef6" opacity="1" style="animation-delay:1.9s">Java Full Stack Developer</text>
  <text class="role jb" x="92" y="402" font-size="21" fill="#eceef6" opacity="0" style="animation-delay:4.9s">Spring Boot &amp; React Builder</text>
  <text class="role jb" x="92" y="402" font-size="21" fill="#eceef6" opacity="0" style="animation-delay:7.9s">AI &amp; Data Science Enthusiast</text>
  <text class="role jb" x="92" y="402" font-size="21" fill="#eceef6" opacity="0" style="animation-delay:10.9s">150+ DSA Problem Solver</text>

  <text class="sgm fu" x="64" y="442" font-size="16" fill="#8d93ab" style="animation-delay:2.5s">Building fast, scalable full-stack apps with Java, Spring Boot &amp; React,</text>
  <text class="sgm fu" x="64" y="464" font-size="16" fill="#8d93ab" style="animation-delay:2.62s">and AI-powered tools that solve real-world problems.</text>

  <!-- Info pills -->
  <g class="fu" style="animation-delay:3.0s">
    <g transform="translate(72,498)">
      <path d="M0-8a6 6 0 0 1 6 6c0 4.5-6 10-6 10s-6-5.5-6-10a6 6 0 0 1 6-6z" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
      <circle cy="-2" r="2" fill="#22d3ee"/>
    </g>
    <text class="jb" x="88" y="503" font-size="14" fill="#8d93ab">Pune, India</text>
  </g>
  <g class="fu" style="animation-delay:3.15s">
    <g transform="translate(210,498)">
      <rect x="-7" y="-5" width="14" height="11" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
      <path d="M-3-5v-2.5h6V-5" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
    </g>
    <text class="jb" x="226" y="503" font-size="14" fill="#8d93ab">B.Tech CSE · Data Science</text>
  </g>
  <g class="fu" style="animation-delay:3.3s">
    <g transform="translate(430,498)">
      <path d="M0-8l2.4 5 5.4.6-4 3.7 1.1 5.4L0 4 -4.9 6.7-3.8 1.3-7.8-2.4l5.4-.6z" fill="none" stroke="#f472b6" stroke-width="1.7" stroke-linejoin="round"/>
    </g>
    <text class="jb" x="446" y="503" font-size="14" fill="#8d93ab">1st Rank · 84.20%</text>
  </g>
</g>

<rect x=".75" y=".75" width="1278.5" height="538.5" rx="25.5" fill="none" stroke="#262a42" stroke-width="1.5"/>
</svg>
