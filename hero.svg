    <g transform="translate(940, 185)">
      <!-- Hair back -->
      <path d="M-44 -8 Q-46 -58 -22 -76 Q0 -86 22 -76 Q46 -58 44 -8 Q40 -19 31 -21 L31 5 Q20 -3 0 -5 Q-20 -3 -31 5 L-31 -21 Q-40 -19 -44 -8 Z" fill="url(#hairG)"/>
      <!-- Face -->
      <ellipse cx="0" cy="0" rx="40" ry="46" fill="url(#skinG)"/>
      <!-- Hair front -->
      <path d="M-46 -22 Q-42 -58 -22 -74 Q0 -84 22 -74 Q42 -58 46 -22 Q31 -36 15 -34 Q0 -32 -15 -34 Q-31 -36 -46 -22 Z" fill="url(#hairG)"/>
      <!-- Fringe -->
      <path d="M-22 -58 Q-8 -68 15 -60 Q6 -46 0 -40 Q-12 -46 -22 -58 Z" fill="url(#hairG)"/>

      <!-- Ears -->
      <ellipse cx="-40" cy="0" rx="6" ry="10" fill="#d9a273"/>
      <ellipse cx="40" cy="0" rx="6" ry="10" fill="#d9a273"/>

      <!-- Eyebrows -->
      <path d="M-25 -15 Q-17 -18 -10 -15" stroke="#1a0f08" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M10 -15 Q17 -18 25 -15" stroke="#1a0f08" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Eyes with blink -->
      <g class="eye">
        <ellipse cx="-17" cy="-3" rx="5.5" ry="5" fill="#1a0f08"/>
        <ellipse cx="17" cy="-3" rx="5.5" ry="5" fill="#1a0f08"/>
        <circle cx="-15.5" cy="-4.5" r="1.6" fill="#ffffff" opacity=".95"/>
        <circle cx="18.5" cy="-4.5" r="1.6" fill="#ffffff" opacity=".95"/>
      </g>

      <!-- Nose -->
      <path d="M-2 8 Q0 13 2 8" stroke="#b8845a" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Friendly smile -->
      <path d="M-12 21 Q0 30 12 21" stroke="#8b5a3a" stroke-width="2.2" stroke-linecap="round" fill="none"/>

      <!-- Blush -->
      <ellipse cx="-26" cy="13" rx="6.5" ry="4" fill="#f472b6" opacity=".28"/>
      <ellipse cx="26" cy="13" rx="6.5" ry="4" fill="#f472b6" opacity=".28"/>
    </g>

