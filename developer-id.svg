<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Dharmanath Kadam — Developer ID Card">
<title>Dharmanath Kadam — Developer ID Card</title>
<defs>
  <style>
    .sg{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
    .sgm{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
    .jb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .jbb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:700}
    @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
    @keyframes drop{0%{transform:translateY(-900px) rotate(0deg)}22%{transform:translateY(0) rotate(0deg)}42%{transform:rotate(3deg)}62%{transform:rotate(-2deg)}80%{transform:rotate(1deg)}100%{transform:rotate(0deg)}}
    @keyframes foil{0%{transform:translateX(-500px)}55%,100%{transform:translateX(500px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .swing{transform-box:view-box;transform-origin:400px -60px;animation:drop 2.6s cubic-bezier(.3,1,.5,1) forwards, sway 6s ease-in-out 2.6s infinite}
    .foil{animation:foil 6s ease-in-out infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#171a2c"/><stop offset="1" stop-color="#121423"/>
  </linearGradient>
  <linearGradient id="strapG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="idbg" x1="0" y1="0" x2=".6" y2="1">
    <stop offset="0" stop-color="#1b2140"/><stop offset=".55" stop-color="#141829"/><stop offset="1" stop-color="#191330"/>
  </linearGradient>
  <linearGradient id="foilG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".35" stop-color="#22d3ee" stop-opacity=".18"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".22"/>
    <stop offset=".65" stop-color="#f472b6" stop-opacity=".18"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d7dbe6"/><stop offset=".45" stop-color="#8c93a6"/>
    <stop offset=".55" stop-color="#6b7280"/><stop offset="1" stop-color="#aab1c2"/>
  </linearGradient>
  <linearGradient id="chipG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d6a13a"/>
  </linearGradient>
  <linearGradient id="avatarG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b82f6"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".6"/><stop offset=".5" stop-color="#262a42"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".6"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="13" r=".9" fill="#ffffff" fill-opacity=".06"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".6"/>
  </filter>
  <clipPath id="cardClip"><rect x="100" y="150" width="600" height="800" rx="40"/></clipPath>
</defs>

<!-- Background -->
<rect width="800" height="1000" rx="28" fill="url(#cardbg)"/>
<rect width="800" height="1000" rx="28" fill="url(#dots)"/>
<rect x=".75" y=".75" width="798.5" height="998.5" rx="27.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

<!-- ═══ SWINGING BIG ID CARD ═══ -->
<g class="swing">

  <!-- Lanyard strap -->
  <path d="M370 -60 L430 -60 L420 130 L380 130 Z" fill="url(#strapG)"/>
  <text class="jbb" font-size="14" fill="#ffffff" fill-opacity=".9" letter-spacing="3" transform="translate(405,-50) rotate(90)">DK · JAVA DEV · DK · JAVA DEV · DK</text>

  <!-- Metal clip -->
  <rect x="360" y="128" width="80" height="34" rx="8" fill="url(#metal)"/>
  <rect x="382" y="136" width="36" height="10" rx="5" fill="#394050" fill-opacity=".15"/>
  <circle cx="400" cy="180" r="18" fill="none" stroke="url(#metal)" stroke-width="7"/>

  <!-- Card body -->
  <g filter="url(#shadow)">
    <rect x="100" y="200" width="600" height="740" rx="40" fill="url(#idbg)" stroke="url(#ringG)" stroke-opacity=".6" stroke-width="2.5"/>
  </g>

  <!-- Card header -->
  <g clip-path="url(#cardClip)">
    <text class="jbb" x="140" y="250" font-size="20" fill="#22d3ee" letter-spacing="4">DEVELOPER ID</text>
    <text class="jb"  x="660" y="250" font-size="18" fill="#8d93ab" text-anchor="end" letter-spacing="2">v2.0</text>

    <!-- Avatar frame -->
    <rect x="300" y="300" width="200" height="240" rx="28" fill="none" stroke="url(#ringG)" stroke-opacity=".8" stroke-width="3"/>
    <rect x="308" y="308" width="184" height="224" rx="22" fill="url(#avatarG)"/>
    <text class="sg" x="400" y="465" font-size="110" fill="#ffffff" text-anchor="middle" letter-spacing="4">DK</text>

    <!-- Gold chip on left -->
    <rect x="140" y="320" width="52" height="40" rx="8" fill="url(#chipG)"/>
    <path d="M140 333h52M166 320v40" stroke="#8a6a1e" stroke-width="1.4" stroke-opacity=".7"/>

    <!-- Signal waves right -->
    <g stroke="#34d399" stroke-width="2.6" fill="none" opacity=".95" transform="translate(660,340)">
      <path d="M0-14a20 20 0 0 1 0 28"/>
      <path d="M-9-9a13 13 0 0 1 0 18"/>
      <circle cx="-16" cy="0" r="3" fill="#34d399" stroke="none"/>
    </g>

    <!-- Name -->
    <text class="sg" x="400" y="620" font-size="44" fill="#eceef6" text-anchor="middle" letter-spacing="1">DHARMANATH</text>
    <text class="sg" x="400" y="672" font-size="44" fill="#eceef6" text-anchor="middle" letter-spacing="1">KADAM</text>

    <!-- Role pill -->
    <rect x="240" y="700" width="320" height="48" rx="24" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/>
    <text class="jb" x="400" y="731" font-size="19" fill="#a78bfa" text-anchor="middle" letter-spacing="3">JAVA FULL STACK DEV</text>

    <!-- Divider -->
    <line x1="140" y1="785" x2="660" y2="785" stroke="#262a42" stroke-width="1.5"/>

    <!-- Info grid -->
    <text class="jb"  x="150" y="825" font-size="14" fill="#8d93ab" letter-spacing="2.5">BASE</text>
    <text class="sgm" x="150" y="855" font-size="22" fill="#eceef6">Pune, India</text>

    <text class="jb"  x="440" y="825" font-size="14" fill="#8d93ab" letter-spacing="2.5">MODE</text>
    <text class="sgm" x="440" y="855" font-size="22" fill="#eceef6">Hybrid / Remote</text>

    <text class="jb"  x="150" y="905" font-size="14" fill="#8d93ab" letter-spacing="2.5">ID</text>
    <text class="sgm" x="150" y="935" font-size="22" fill="#eceef6">DK-2025-JFS</text>

    <text class="jb"  x="440" y="905" font-size="14" fill="#8d93ab" letter-spacing="2.5">STACK</text>
    <text class="sgm" x="440" y="935" font-size="22" fill="#eceef6">Java · Spring · React</text>

    <!-- Barcode -->
    <g fill="#eceef6" fill-opacity=".85">
      <rect x="150" y="1055" width="4" height="24"/>
      <rect x="158" y="1055" width="2.4" height="24"/>
      <rect x="164" y="1055" width="2.4" height="24"/>
      <rect x="170" y="1055" width="2.4" height="24"/>
      <rect x="176" y="1055" width="6" height="24"/>
      <rect x="186" y="1055" width="2.4" height="24"/>
      <rect x="192" y="1055" width="6" height="24"/>
      <rect x="202" y="1055" width="2.4" height="24"/>
      <rect x="208" y="1055" width="6" height="24"/>
      <rect x="218" y="1055" width="2.4" height="24"/>
      <rect x="224" y="1055" width="4" height="24"/>
      <rect x="232" y="1055" width="2.4" height="24"/>
      <rect x="238" y="1055" width="2.4" height="24"/>
      <rect x="244" y="1055" width="4" height="24"/>
      <rect x="252" y="1055" width="4" height="24"/>
      <rect x="260" y="1055" width="2.4" height="24"/>
      <rect x="266" y="1055" width="2.4" height="24"/>
      <rect x="272" y="1055" width="2.4" height="24"/>
      <rect x="278" y="1055" width="2.4" height="24"/>
      <rect x="284" y="1055" width="4" height="24"/>
      <rect x="292" y="1055" width="2.4" height="24"/>
      <rect x="298" y="1055" width="6" height="24"/>
      <rect x="308" y="1055" width="2.4" height="24"/>
      <rect x="314" y="1055" width="6" height="24"/>
      <rect x="324" y="1055" width="6" height="24"/>
      <rect x="334" y="1055" width="2.4" height="24"/>
      <rect x="340" y="1055" width="6" height="24"/>
      <rect x="350" y="1055" width="2.4" height="24"/>
      <rect x="356" y="1055" width="2.4" height="24"/>
      <rect x="362" y="1055" width="2.4" height="24"/>
      <rect x="368" y="1055" width="2.4" height="24"/>
      <rect x="374" y="1055" width="2.4" height="24"/>
      <rect x="380" y="1055" width="2.4" height="24"/>
      <rect x="386" y="1055" width="2.4" height="24"/>
      <rect x="392" y="1055" width="4" height="24"/>
      <rect x="400" y="1055" width="2.4" height="24"/>
      <rect x="406" y="1055" width="2.4" height="24"/>
      <rect x="412" y="1055" width="6" height="24"/>
      <rect x="422" y="1055" width="2.4" height="24"/>
      <rect x="428" y="1055" width="2.4" height="24"/>
      <rect x="434" y="1055" width="6" height="24"/>
      <rect x="444" y="1055" width="4" height="24"/>
      <rect x="452" y="1055" width="2.4" height="24"/>
      <rect x="458" y="1055" width="6" height="24"/>
    </g>

    <!-- Handle -->
    <text class="jb" x="660" y="1070" font-size="16" fill="#8d93ab" text-anchor="end">@dharmanathsk04</text>

    <!-- Holographic foil sweep -->
    <g class="foil"><rect x="-120" y="200" width="180" height="740" fill="url(#foilG)" transform="skewX(-14)"/></g>
  </g>

  <!-- Live dot -->
  <g transform="translate(150, 1085)">
    <circle r="7" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text class="jbb" x="20" y="7" font-size="14" fill="#34d399" letter-spacing="1.5">OPEN TO WORK</text>
  </g>
</g>
</svg>
