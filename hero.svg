      <rect x="-90" y="-80" width="180" height="150" rx="10" fill="#0a0e14" stroke="#262a42" stroke-width="2"/>
      <!-- Screen -->
      <rect x="-80" y="-70" width="160" height="130" rx="5" fill="url(#screenG)"/>

      <!-- Code lines on screen -->
      <g clip-path="url(#screenClip)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">
        <text x="1024" y="165" fill="#22d3ee">public class Dev {</text>
        <text x="1034" y="183" fill="#fbbf24">void build() {</text>
        <text x="1044" y="201" fill="#a78bfa">Spring.run();</text>
        <text x="1044" y="219" fill="#34d399">React.render();</text>
        <text x="1034" y="237" fill="#fbbf24">}</text>
        <text x="1024" y="255" fill="#22d3ee">}</text>
        <rect x="1044" y="262" width="6" height="10" fill="#22d3ee" class="cursor"/>
      </g>

