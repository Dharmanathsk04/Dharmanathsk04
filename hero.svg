      <path d="M0 30 Q14 10 6 -4 Q-2 10 0 22" fill="#34d399" opacity=".85"/>
      <path d="M0 30 Q-22 18 -16 4 Q-4 14 -2 24" fill="#22c55e" opacity=".7"/>
      <path d="M0 30 Q20 16 14 2 Q2 12 0 24" fill="#34d399" opacity=".7"/>
    </g>

    <!-- Monitor to the right -->
