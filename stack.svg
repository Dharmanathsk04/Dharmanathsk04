      <rect x="250" y="465" width="100" height="8" rx="4" fill="#1a1f2e"/>
    </g>

    <!-- Boy character -->
    <g transform="translate(300, 560)">
      <!-- Chair -->
      <rect x="-110" y="-140" width="220" height="180" rx="30" fill="#1a1f2e" stroke="#262a42" stroke-width="1.5"/>
      <!-- Body -->
      <path d="M-95 40 Q-95 -50 -55 -95 Q-20 -130 0 -130 Q20 -130 55 -95 Q95 -50 95 40 Z" fill="url(#shirtG)"/>
      <path d="M-70 -80 Q-50 -120 0 -125 Q50 -120 70 -80 Q40 -100 0 -105 Q-40 -100 -70 -80 Z" fill="#1e40af" opacity=".7"/>
      <!-- Neck -->
      <rect x="-18" y="-150" width="36" height="30" rx="10" fill="#d9a273"/>
      <!-- Head -->
      <g transform="translate(0, -210)">
        <path d="M-60 -10 Q-62 -70 -30 -95 Q0 -110 30 -95 Q62 -70 60 -10 Q55 -20 45 -22 L45 5 Q30 -5 0 -8 Q-30 -5 -45 5 L-45 -22 Q-55 -20 -60 -10 Z" fill="url(#hairG)"/>
        <ellipse cx="0" cy="0" rx="52" ry="60" fill="url(#skinG)"/>
        <path d="M-62 -25 Q-58 -70 -30 -92 Q0 -108 30 -92 Q58 -70 62 -25 Q40 -45 20 -40 Q0 -38 -20 -42 Q-40 -45 -62 -25 Z" fill="url(#hairG)"/>
        <path d="M-30 -70 Q-10 -82 20 -75 Q10 -60 0 -55 Q-15 -60 -30 -70 Z" fill="url(#hairG)"/>
        <ellipse cx="-52" cy="0" rx="8" ry="12" fill="#d9a273"/>
        <ellipse cx="52" cy="0" rx="8" ry="12" fill="#d9a273"/>
        <path d="M-32 -18 Q-22 -22 -14 -18" stroke="#1a0f08" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M14 -18 Q22 -22 32 -18" stroke="#1a0f08" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="-22" cy="-4" rx="6" ry="5" fill="#1a0f08">
          <animate attributeName="ry" values="5;5;1;5;5" keyTimes="0;0.85;0.9;0.95;1" dur="4.5s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="22" cy="-4" rx="6" ry="5" fill="#1a0f08">
          <animate attributeName="ry" values="5;5;1;5;5" keyTimes="0;0.85;0.9;0.95;1" dur="4.5s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="-20" cy="-6" r="1.8" fill="#ffffff" opacity=".9"/>
        <circle cx="24" cy="-6" r="1.8" fill="#ffffff" opacity=".9"/>
        <path d="M-3 10 Q0 16 3 10" stroke="#b8845a" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M-15 26 Q0 38 15 26" stroke="#8b5a3a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="-35" cy="15" rx="8" ry="5" fill="#f472b6" opacity=".25"/>
        <ellipse cx="35" cy="15" rx="8" ry="5" fill="#f472b6" opacity=".25"/>
      </g>
      <!-- Arms -->
      <path d="M-80 -60 Q-130 -20 -115 30 Q-110 45 -95 45" fill="none" stroke="url(#shirtG)" stroke-width="26" stroke-linecap="round"/>
      <ellipse cx="-93" cy="48" rx="14" ry="10" fill="#f4c9a0"/>
      <path d="M80 -60 Q130 -20 115 30 Q110 45 95 45" fill="none" stroke="url(#shirtG)" stroke-width="26" stroke-linecap="round"/>
      <ellipse cx="93" cy="48" rx="14" ry="10" fill="#f4c9a0"/>
      <!-- Laptop -->
      <g transform="translate(0, 60)">
        <path d="M-90 20 L-80 -50 L80 -50 L90 20 Z" fill="#1a1f2e" stroke="#262a42" stroke-width="1.5"/>
        <rect x="-72" y="-42" width="144" height="55" rx="4" fill="#0a0e14"/>
        <text x="-60" y="-25" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#22d3ee">&lt;code/&gt;</text>
        <text x="-60" y="-10" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#a78bfa">build()</text>
        <text x="-60" y="5" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#fbbf24">deploy()</text>
        <rect x="-80" y="18" width="160" height="6" rx="3" fill="#2a3142"/>
      </g>
    </g>
  </g>

  <!-- ═══ RIGHT: ORGANIZED TECH CHIPS ═══ -->

  <!-- Category: LANGUAGES -->
  <g class="fu" style="animation-delay:.55s">
    <rect x="640" y="70" width="6" height="26" rx="3" fill="#22d3ee"/>
    <text class="jbb" x="662" y="90" font-size="16" fill="#22d3ee" letter-spacing="2.5">LANGUAGES</text>
  </g>
  <g class="fu" style="animation-delay:.65s">
    <rect x="640" y="110" width="120" height="52" rx="14" fill="#f89820" fill-opacity=".12" stroke="#f89820" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="664" cy="136" r="6" fill="#f89820"/>
    <text class="jb" x="682" y="142" font-size="17" fill="#eceef6">Java</text>
  </g>
  <g class="fu" style="animation-delay:.72s">
    <rect x="776" y="110" width="140" height="52" rx="14" fill="#3776AB" fill-opacity=".12" stroke="#3776AB" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="800" cy="136" r="6" fill="#3776AB"/>
    <text class="jb" x="818" y="142" font-size="17" fill="#eceef6">Python</text>
