      <circle cx="1138" cy="366" r="4.5" fill="#61DAFB"/>
      <text class="jb" x="1152" y="372" font-size="13" fill="#eceef6">React</text>
    </g>
    <g class="float" style="animation-delay:1.5s">
      <rect x="770" y="340" width="110" height="32" rx="10" fill="#4479A1" fill-opacity=".14" stroke="#4479A1" stroke-opacity=".6"/>
      <circle cx="788" cy="356" r="4.5" fill="#4479A1"/>
      <text class="jb" x="802" y="362" font-size="13" fill="#eceef6">MySQL</text>
    </g>
