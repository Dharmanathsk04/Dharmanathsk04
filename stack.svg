<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Dharmanath Kadam — Tech Stack Cinematic">
<title>Dharmanath Kadam — Tech Stack</title>
<defs>
  <style>
    .sg{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
    .sgm{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
    .jb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .jbb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:700}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,26px)}}
    @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(560px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
    .fi{animation:fadeIn .7s ease both}
    .float{animation:float 3.5s ease-in-out infinite}
    .blob{animation:drift 14s ease-in-out infinite alternate}
    .blob2{animation:drift2 16s ease-in-out infinite alternate}
    .scanline{animation:scan 3.5s linear infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#171a2c"/><stop offset="1" stop-color="#121423"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".6"/><stop offset=".5" stop-color="#262a42"/><stop offset="1" stop-color="#f472b6" stop-opacity=".6"/>
  </linearGradient>
  <linearGradient id="titleG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-.35 0;.35 0;-.35 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="screenG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1e1a"/><stop offset="1" stop-color="#06100e"/>
  </linearGradient>
  <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4c9a0"/><stop offset="1" stop-color="#d9a273"/>
  </linearGradient>
  <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b1a0f"/><stop offset="1" stop-color="#1a0f08"/>
  </linearGradient>
  <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/>
  </linearGradient>
  <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowP" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".3"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="13" r=".9" fill="#ffffff" fill-opacity=".06"/>
  </pattern>
  <filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="card"><rect width="1280" height="720" rx="26"/></clipPath>
  <clipPath id="screenClip"><rect x="120" y="200" width="360" height="230" rx="10"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#cardbg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- Ambient blobs -->
  <g filter="url(#blur60)" opacity=".55">
    <circle class="blob" cx="180" cy="140" r="170" fill="#22d3ee" fill-opacity=".22"/>
    <circle class="blob2" cx="1100" cy="600" r="180" fill="#a78bfa" fill-opacity=".22"/>
    <circle class="blob" cx="1180" cy="120" r="140" fill="#f472b6" fill-opacity=".14"/>
  </g>

  <!-- ═══ HEADER ═══ -->
  <g class="fu" style="animation-delay:.1s">
    <rect x="60" y="56" width="240" height="32" rx="16" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".5"/>
    <circle cx="80" cy="72" r="4.5" fill="#22d3ee"/>
    <circle cx="80" cy="72" r="4" fill="none" stroke="#22d3ee" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="jbb" x="94" y="77" font-size="12" fill="#22d3ee" letter-spacing="1.8">// TECH STACK</text>
  </g>

  <text class="sg fu" x="60" y="140" font-size="52" fill="url(#titleG)" filter="url(#glow)" style="animation-delay:.2s">Tools I build with</text>
  <text class="sgm fu" x="60" y="178" font-size="19" fill="#8d93ab" style="animation-delay:.3s">Dharmanath Kadam · Java Full Stack Developer · AI &amp; Data Science</text>

  <!-- ═══ LEFT: ILLUSTRATED DEVELOPER AT DESK ═══ -->
  <g class="fu" style="animation-delay:.4s">
    <ellipse cx="320" cy="540" rx="320" ry="160" fill="url(#glowG)"/>
    <ellipse cx="360" cy="240" rx="200" ry="140" fill="url(#glowP)"/>

    <!-- Monitor -->
    <g>
      <rect x="105" y="185" width="390" height="260" rx="16" fill="#0a0e14" stroke="#262a42" stroke-width="2"/>
      <rect x="120" y="200" width="360" height="230" rx="10" fill="url(#screenG)"/>

      <!-- Code on screen -->
      <g clip-path="url(#screenClip)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">
        <text x="135" y="224" fill="#22d3ee">public class TechStack {</text>
        <text x="145" y="244" fill="#fbbf24">public static void main() {</text>
        <text x="155" y="264" fill="#a78bfa">SpringApplication.run();</text>
        <text x="155" y="284" fill="#34d399">System.out.println(</text>
        <text x="165" y="304" fill="#f472b6">"Java &amp; React dev");</text>
        <text x="145" y="324" fill="#fbbf24">}</text>
        <text x="135" y="344" fill="#22d3ee">}</text>
        <text x="155" y="364" fill="#8d93ab">// Building the future</text>
        <text x="155" y="384" fill="#8d93ab">// one commit at a time</text>
        <rect x="155" y="396" width="9" height="16" fill="#22d3ee" class="cursor"/>
      </g>

      <!-- Scanline -->
      <g clip-path="url(#screenClip)">
        <rect class="scanline" x="120" y="200" width="360" height="30" fill="#22d3ee" opacity=".08"/>
      </g>

