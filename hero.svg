      <rect x="0" y="0" width="140" height="36" rx="5" fill="#0a0e14" stroke="#262a42" stroke-width="1"/>
      <g fill="#2a3142">
        <rect x="8" y="7" width="12" height="6" rx="1"/>
        <rect x="24" y="7" width="12" height="6" rx="1"/>
        <rect x="40" y="7" width="12" height="6" rx="1"/>
        <rect x="56" y="7" width="12" height="6" rx="1"/>
        <rect x="72" y="7" width="12" height="6" rx="1"/>
        <rect x="88" y="7" width="12" height="6" rx="1"/>
        <rect x="104" y="7" width="12" height="6" rx="1"/>
        <rect x="120" y="7" width="12" height="6" rx="1"/>
        <rect x="12" y="16" width="12" height="6" rx="1"/>
        <rect x="28" y="16" width="12" height="6" rx="1"/>
        <rect x="44" y="16" width="12" height="6" rx="1"/>
        <rect x="60" y="16" width="12" height="6" rx="1"/>
        <rect x="76" y="16" width="12" height="6" rx="1"/>
        <rect x="92" y="16" width="12" height="6" rx="1"/>
        <rect x="108" y="16" width="12" height="6" rx="1"/>
        <rect x="28" y="25" width="80" height="6" rx="1"/>
      </g>
    </g>

    <!-- Coffee mug with steam -->
    <g transform="translate(1040, 458)">
      <ellipse cx="0" cy="0" rx="14" ry="4" fill="#2a3142" opacity=".6"/>
      <rect x="-13" y="-18" width="26" height="20" rx="4" fill="#2a3142"/>
      <ellipse cx="0" cy="-18" rx="13" ry="3.5" fill="#3a4152"/>
      <ellipse cx="0" cy="-18" rx="9" ry="2.5" fill="#5a2f1e"/>
      <path d="M13 -12 Q22 -8 13 0" fill="none" stroke="#2a3142" stroke-width="3"/>
      <!-- Steam -->
      <path d="M-4 -25 Q-6 -32 -3 -38" stroke="#8d93ab" stroke-width="1.4" fill="none" opacity=".6">
        <animate attributeName="opacity" values=".2;.7;.2" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="d" values="M-4 -25 Q-6 -32 -3 -38;M-4 -25 Q-2 -32 -4 -40;M-4 -25 Q-6 -32 -3 -38" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M4 -25 Q6 -33 3 -40" stroke="#8d93ab" stroke-width="1.4" fill="none" opacity=".6">
        <animate attributeName="opacity" values=".5;.2;.5" dur="3.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Small plant -->
    <g transform="translate(795, 405)">
      <path d="M-12 30 L12 30 L9 48 L-9 48 Z" fill="#4a2e1e"/>
      <path d="M-12 30 L12 30 L11 33 L-11 33 Z" fill="#5a3a2a"/>
