    <rect x="340" y="206" width="100" height="52" rx="14" fill="#f89820" fill-opacity=".1" stroke="#f89820" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="364" cy="232" r="6" fill="#f89820"/>
    <text class="jb" x="382" y="238" font-size="17" fill="#eceef6">Java</text>
