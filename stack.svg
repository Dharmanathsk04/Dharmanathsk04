    <circle cx="608" cy="232" r="6" fill="#F7DF1E"/>
    <text class="jb" x="626" y="238" font-size="17" fill="#eceef6">JavaScript</text>
  </g>
  <g class="fu" style="animation-delay:.60s">
    <rect x="756" y="206" width="110" height="52" rx="14" fill="#E34F26" fill-opacity=".1" stroke="#E34F26" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="780" cy="232" r="6" fill="#E34F26"/>
    <text class="jb" x="798" y="238" font-size="17" fill="#eceef6">HTML5</text>
