  <ellipse cx="262" cy="290" rx="145" ry="48" transform="rotate(120 262 290)"/>
</g>
<circle cx="117" cy="290" r="7" fill="#61dafb"/>
<circle cx="407" cy="290" r="7" fill="#0AE448"/>
<circle cx="334" cy="414" r="7" fill="#F7DF1E"/>
<g class="core">
  <circle cx="262" cy="290" r="46" fill="url(#coreG)"/>
  <text class="sg" x="262" y="301" font-size="28" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
</g>

