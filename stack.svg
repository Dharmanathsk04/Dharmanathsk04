  <g class="fu" style="animation-delay:1.65s">
    <rect x="640" y="485" width="130" height="52" rx="14" fill="#4479A1" fill-opacity=".12" stroke="#4479A1" stroke-opacity=".55" stroke-width="1.5"/>
