    <text class="jb" x="1160" y="142" font-size="17" fill="#eceef6">HTML5</text>
  </g>

  <!-- Category: BACKEND -->
  <g class="fu" style="animation-delay:.93s">
    <rect x="640" y="195" width="6" height="26" rx="3" fill="#a78bfa"/>
    <text class="jbb" x="662" y="215" font-size="16" fill="#a78bfa" letter-spacing="2.5">BACKEND &amp; FRAMEWORKS</text>
  </g>
  <g class="fu" style="animation-delay:1.03s">
    <rect x="640" y="235" width="190" height="52" rx="14" fill="#6DB33F" fill-opacity=".12" stroke="#6DB33F" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="664" cy="261" r="6" fill="#6DB33F"/>
    <text class="jb" x="682" y="267" font-size="17" fill="#eceef6">Spring Boot</text>
  </g>
  <g class="fu" style="animation-delay:1.10s">
