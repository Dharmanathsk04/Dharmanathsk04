    <ellipse cx="982" cy="428" rx="15" ry="10" fill="#f4c9a0"/>

    <!-- Desk surface -->
    <rect x="760" y="435" width="480" height="105" fill="url(#deskG)"/>
    <rect x="760" y="435" width="480" height="2.5" fill="#22d3ee" opacity=".55"/>

    <!-- Keyboard on desk -->
