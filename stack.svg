<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Dharmanath Kadam — Tech Stack">
<title>Dharmanath Kadam — Tech Stack</title>
<desc>Tech icons orbiting a React-style atom core with grouped chips: languages, backend, frontend, databases, AI &amp; data science, and tools.</desc>
<defs>
  <style>
    .sg{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
    .sgm{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
    .jb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .jbb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:700}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    .fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
    .chip{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
    .core{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <radialGradient id="coreG" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#f472b6"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#4c1d95"/>
  </radialGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#171a2c"/><stop offset="1" stop-color="#121423"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset=".5" stop-color="#262a42"/><stop offset="1" stop-color="#f472b6" stop-opacity=".5"/>
  </linearGradient>
  <pattern id="dots3" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r=".8" fill="#ffffff" fill-opacity=".05"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="1280" height="480" rx="24" fill="url(#cardbg)"/>
<rect width="1280" height="480" rx="24" fill="url(#dots3)"/>
<rect x=".75" y=".75" width="1278.5" height="478.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

<!-- Header -->
<g class="fu" style="animation-delay:.1s">
  <text class="jbb" x="40" y="54" font-size="12.5" fill="#22d3ee" letter-spacing="2.2">// TECH STACK</text>
  <text class="sg" x="40" y="94" font-size="29" fill="#eceef6" letter-spacing="-.5">Tools I build with</text>
  <text class="sgm" x="40" y="118" font-size="13" fill="#8d93ab">Dharmanath Kadam · Java Full Stack · AI &amp; Data Science</text>
</g>

<!-- Divider between left visual and right chips -->
<line x1="520" y1="150" x2="520" y2="440" stroke="#262a42" stroke-width="1"/>

<!-- ═══ LEFT: React-style atom ═══ -->
<circle cx="262" cy="290" r="130" fill="url(#halo)"/>
<circle cx="262" cy="290" r="46" fill="none" stroke="#f472b6" stroke-width="1.5">
  <animate attributeName="r" values="46;82" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".7;0" dur="2.8s" repeatCount="indefinite"/>
</circle>
<g opacity=".35" stroke="#61dafb" fill="none" stroke-width="1.5">
