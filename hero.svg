<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Dharmanath Kadam — Java Full Stack Developer">
<title>Dharmanath Kadam — Java Full Stack Developer</title>
<defs>
  <style>
    .sg{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
    .sgm{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
    .jb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .jbb{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:700}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes role{0%{opacity:0;transform:translateY(16px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}25.5%{opacity:0;transform:translateY(-16px)}100%{opacity:0;transform:translateY(-16px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,26px)}}
    @keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(420px)}}
    @keyframes typewriter{from{width:0}to{width:100%}}
    @keyframes eyeBlink{0%,85%,100%{transform:scaleY(1)}90%{transform:scaleY(0.1)}}
    .fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
    .fi{animation:fadeIn .7s ease both}
    .role{animation:role 12s cubic-bezier(.2,.8,.2,1) infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    .blob{animation:drift 14s ease-in-out infinite alternate}
    .blob2{animation:drift2 16s ease-in-out infinite alternate}
    .float{animation:float 3.5s ease-in-out infinite}
    .corner{stroke-dasharray:60;animation:draw .8s ease both}
    .scanline{animation:scan 4s linear infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:eyeBlink 4.5s infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-.35 0;.35 0;-.35 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="nameG2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#171a2c"/><stop offset="1" stop-color="#121423"/>
  </linearGradient>
  <linearGradient id="edgeG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset=".5" stop-color="#262a42"/><stop offset="1" stop-color="#f472b6" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4c9a0"/><stop offset="1" stop-color="#d9a273"/>
  </linearGradient>
  <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b1a0f"/><stop offset="1" stop-color="#1a0f08"/>
  </linearGradient>
  <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/>
  </linearGradient>
  <linearGradient id="screenG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1e1a"/><stop offset="1" stop-color="#06100e"/>
  </linearGradient>
  <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowP" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".3"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="13" cy="13" r=".9" fill="#ffffff" fill-opacity=".06"/>
  </pattern>
  <filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="card"><rect width="1280" height="540" rx="26"/></clipPath>
  <clipPath id="hiClip"><rect x="60" y="130" width="330" height="46"><animate attributeName="width" values="0;0;330" keyTimes="0;.4167;1" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1"/></rect></clipPath>
  <clipPath id="nameClip"><rect x="50" y="170" width="600" height="100"><animate attributeName="y" values="262;262;170" keyTimes="0;.5263;1" dur="1.9s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1"/></rect></clipPath>
  <clipPath id="screenClip"><rect x="820" y="150" width="280" height="180" rx="8"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <!-- Background -->
  <rect width="1280" height="540" fill="url(#cardG)"/>
  <rect width="1280" height="540" fill="url(#dots)"/>

  <!-- Ambient blobs -->
  <g filter="url(#blur60)" opacity=".55">
    <circle class="blob" cx="170" cy="120" r="150" fill="#22d3ee" fill-opacity=".22"/>
    <circle class="blob2" cx="470" cy="470" r="170" fill="#a78bfa" fill-opacity=".22"/>
    <circle class="blob" cx="1150" cy="80" r="130" fill="#f472b6" fill-opacity=".14"/>
  </g>

  <!-- ═══ RIGHT: BOY DEV SCENE (contained, balanced) ═══ -->
  <g class="fu" style="animation-delay:.4s">

    <!-- Glow behind scene -->
    <ellipse cx="1020" cy="380" rx="280" ry="160" fill="url(#glowG)"/>
    <ellipse cx="1060" cy="180" rx="160" ry="120" fill="url(#glowP)"/>

    <!-- Chair back -->
    <rect x="930" y="240" width="180" height="180" rx="30" fill="#1a1f2e" stroke="#262a42" stroke-width="1.5"/>

    <!-- Desk -->
    <rect x="780" y="420" width="460" height="80" fill="#1a1f2e"/>
    <rect x="780" y="420" width="460" height="3" fill="#22d3ee" opacity=".4"/>

    <!-- Monitor (behind boy, right side of scene) -->
    <g transform="translate(1060, 130)">
      <rect x="-100" y="0" width="200" height="150" rx="12" fill="#0a0e14" stroke="#262a42" stroke-width="2"/>
      <rect x="-90" y="10" width="180" height="130" rx="6" fill="url(#screenG)"/>

      <!-- Code on screen -->
      <g clip-path="url(#screenClip)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">
        <text x="830" y="30" fill="#22d3ee">public class Dev {</text>
        <text x="840" y="48" fill="#fbbf24">void build() {</text>
        <text x="850" y="66" fill="#a78bfa">Spring.run();</text>
        <text x="850" y="84" fill="#34d399">React.render();</text>
        <text x="840" y="102" fill="#fbbf24">}</text>
        <text x="830" y="120" fill="#22d3ee">}</text>
        <rect x="850" y="128" width="6" height="10" fill="#22d3ee" class="cursor"/>
      </g>

      <!-- Scanline -->
      <g clip-path="url(#screenClip)">
        <rect class="scanline" x="820" y="150" width="280" height="25" fill="#22d3ee" opacity=".1"/>
      </g>

      <!-- Monitor stand -->
      <rect x="1090" y="280" width="40" height="20" fill="#1a1f2e"/>
      <rect x="1060" y="298" width="100" height="6" rx="3" fill="#1a1f2e"/>
    </g>

    <!-- Boy character (properly sized, seated at desk) -->
    <g transform="translate(920, 380)">

      <!-- Body / hoodie -->
      <path d="M-70 60 L-65 -20 Q-60 -60 -35 -75 L35 -75 Q60 -60 65 -20 L70 60 Z" fill="url(#shirtG)"/>
      <!-- Hoodie pocket -->
      <path d="M-35 0 L35 0 L30 45 L-30 45 Z" fill="#1e40af" opacity=".5"/>
      <!-- Hoodie collar -->
      <path d="M-45 -60 Q-20 -80 0 -80 Q20 -80 45 -60 Q25 -70 0 -72 Q-25 -70 -45 -60 Z" fill="#1e40af" opacity=".7"/>

      <!-- Neck -->
      <rect x="-15" y="-95" width="30" height="25" rx="8" fill="#d9a273"/>

      <!-- Head -->
      <g transform="translate(0, -150)">
        <!-- Hair back -->
        <path d="M-42 -8 Q-44 -55 -22 -72 Q0 -82 22 -72 Q44 -55 42 -8 Q38 -18 30 -20 L30 4 Q20 -4 0 -6 Q-20 -4 -30 4 L-30 -20 Q-38 -18 -42 -8 Z" fill="url(#hairG)"/>
        <!-- Face -->
        <ellipse cx="0" cy="0" rx="38" ry="45" fill="url(#skinG)"/>
        <!-- Hair front -->
        <path d="M-44 -22 Q-40 -55 -22 -70 Q0 -80 22 -70 Q40 -55 44 -22 Q30 -35 15 -33 Q0 -31 -15 -33 Q-30 -35 -44 -22 Z" fill="url(#hairG)"/>
        <!-- Fringe -->
        <path d="M-22 -55 Q-8 -65 15 -58 Q6 -45 0 -40 Q-12 -45 -22 -55 Z" fill="url(#hairG)"/>

        <!-- Ears -->
        <ellipse cx="-38" cy="0" rx="6" ry="9" fill="#d9a273"/>
        <ellipse cx="38" cy="0" rx="6" ry="9" fill="#d9a273"/>

        <!-- Eyebrows -->
        <path d="M-25 -14 Q-17 -17 -10 -14" stroke="#1a0f08" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M10 -14 Q17 -17 25 -14" stroke="#1a0f08" stroke-width="2.5" stroke-linecap="round" fill="none"/>

        <!-- Eyes with blink -->
        <g class="eye">
          <ellipse cx="-17" cy="-3" rx="5" ry="4" fill="#1a0f08"/>
          <ellipse cx="17" cy="-3" rx="5" ry="4" fill="#1a0f08"/>
          <circle cx="-15.5" cy="-4.5" r="1.4" fill="#ffffff" opacity=".9"/>
          <circle cx="18.5" cy="-4.5" r="1.4" fill="#ffffff" opacity=".9"/>
        </g>

        <!-- Nose -->
        <path d="M-2 8 Q0 12 2 8" stroke="#b8845a" stroke-width="1.6" stroke-linecap="round" fill="none"/>

        <!-- Smile -->
        <path d="M-11 20 Q0 28 11 20" stroke="#8b5a3a" stroke-width="2" stroke-linecap="round" fill="none"/>

        <!-- Blush -->
        <ellipse cx="-25" cy="12" rx="6" ry="3.5" fill="#f472b6" opacity=".28"/>
        <ellipse cx="25" cy="12" rx="6" ry="3.5" fill="#f472b6" opacity=".28"/>
      </g>

      <!-- Arms resting at desk -->
      <path d="M-65 -40 Q-100 -10 -95 40 Q-92 60 -75 62" fill="none" stroke="url(#shirtG)" stroke-width="24" stroke-linecap="round"/>
      <ellipse cx="-72" cy="64" rx="13" ry="9" fill="#f4c9a0"/>
      <path d="M65 -40 Q100 -10 95 40 Q92 60 75 62" fill="none" stroke="url(#shirtG)" stroke-width="24" stroke-linecap="round"/>
      <ellipse cx="72" cy="64" rx="13" ry="9" fill="#f4c9a0"/>

      <!-- Laptop on desk -->
      <g transform="translate(0, 70)">
        <path d="M-85 25 L-75 -50 L75 -50 L85 25 Z" fill="#1a1f2e" stroke="#262a42" stroke-width="1.5"/>
        <rect x="-68" y="-42" width="136" height="55" rx="4" fill="#0a0e14"/>
        <text x="-56" y="-25" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#22d3ee">&lt;code/&gt;</text>
        <text x="-56" y="-11" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#a78bfa">build()</text>
        <text x="-56" y="3" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#fbbf24">deploy()</text>
        <rect x="-75" y="23" width="150" height="5" rx="2.5" fill="#2a3142"/>
      </g>

      <!-- Legs under desk -->
      <rect x="-45" y="60" width="20" height="50" fill="#1e293b"/>
      <rect x="25" y="60" width="20" height="50" fill="#1e293b"/>
      <ellipse cx="-35" cy="112" rx="18" ry="6" fill="#0f172a"/>
      <ellipse cx="35" cy="112" rx="18" ry="6" fill="#0f172a"/>
    </g>

    <!-- Floating tech chips (positioned in empty spaces) -->
    <g class="float" style="animation-delay:0s">
      <rect x="770" y="90" width="90" height="30" rx="10" fill="#f89820" fill-opacity=".14" stroke="#f89820" stroke-opacity=".55"/>
      <circle cx="786" cy="105" r="4" fill="#f89820"/>
      <text class="jb" x="800" y="110" font-size="12" fill="#eceef6">Java</text>
    </g>
    <g class="float" style="animation-delay:.5s">
      <rect x="1140" y="70" width="120" height="30" rx="10" fill="#6DB33F" fill-opacity=".14" stroke="#6DB33F" stroke-opacity=".55"/>
      <circle cx="1156" cy="85" r="4" fill="#6DB33F"/>
      <text class="jb" x="1170" y="90" font-size="12" fill="#eceef6">Spring Boot</text>
    </g>
    <g class="float" style="animation-delay:1s">
      <rect x="1140" y="340" width="100" height="30" rx="10" fill="#61DAFB" fill-opacity=".14" stroke="#61DAFB" stroke-opacity=".55"/>
      <circle cx="1156" cy="355" r="4" fill="#61DAFB"/>
      <text class="jb" x="1170" y="360" font-size="12" fill="#eceef6">React</text>
    </g>
    <g class="float" style="animation-delay:1.5s">
      <rect x="770" y="230" width="100" height="30" rx="10" fill="#4479A1" fill-opacity=".14" stroke="#4479A1" stroke-opacity=".55"/>
      <circle cx="786" cy="245" r="4" fill="#4479A1"/>
      <text class="jb" x="800" y="250" font-size="12" fill="#eceef6">MySQL</text>
    </g>
  </g>

  <!-- Viewfinder HUD (corners) -->
  <path class="corner" d="M760 74V40H794" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.3s"/>
  <path class="corner" d="M1236 74V40H1202" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.38s"/>
  <path class="corner" d="M760 466V500H794" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.46s"/>
  <path class="corner" d="M1236 466V500H1202" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.54s"/>

  <g class="fi" style="animation-delay:.6s">
    <circle cx="782" cy="483" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text class="jbb" x="794" y="488" font-size="13" fill="#eceef6" letter-spacing="2">LIVE</text>
    <text class="jb" x="1222" y="488" font-size="12" fill="#8d93ab" text-anchor="end" letter-spacing="1.5">DHARMANATH.DEV · 24FPS</text>
  </g>

  <!-- ═══ LEFT: INFO ═══ -->
  <g class="fu" style="animation-delay:.2s">
    <rect x="64" y="64" width="240" height="32" rx="16" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/>
    <circle cx="84" cy="80" r="4.5" fill="#34d399"/>
    <circle cx="84" cy="80" r="4" fill="none" stroke="#34d399" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="jbb" x="98" y="85" font-size="12" fill="#34d399" letter-spacing="1.6">OPEN TO WORK</text>
  </g>

  <text clip-path="url(#hiClip)" class="sgm" x="64" y="164" font-size="30" fill="#eceef6">Hi there, I'm</text>

  <g clip-path="url(#nameClip)">
    <text class="sg" x="60" y="250" font-size="68" letter-spacing="-1.5" fill="url(#nameG)" filter="url(#glow)">DHARMANATH</text>
  </g>
  <text class="sg fu" x="60" y="316" font-size="68" letter-spacing="-1.5" fill="url(#nameG)" filter="url(#glow)" style="animation-delay:1.8s">KADAM</text>

  <rect x="64" y="338" width="120" height="3" rx="1.5" fill="url(#nameG2)">
    <animate attributeName="width" values="0;0;120" keyTimes="0;.68;1" dur="2.5s" begin="0s" fill="freeze"/>
  </rect>

  <!-- Cycling roles -->
  <text class="jbb fi" x="64" y="384" font-size="20" fill="#22d3ee" style="animation-delay:1.8s">&gt;</text>
  <text class="role jb" x="90" y="384" font-size="20" fill="#eceef6" opacity="1" style="animation-delay:1.9s">Java Full Stack Developer</text>
  <text class="role jb" x="90" y="384" font-size="20" fill="#eceef6" opacity="0" style="animation-delay:4.9s">Spring Boot &amp; React Builder</text>
  <text class="role jb" x="90" y="384" font-size="20" fill="#eceef6" opacity="0" style="animation-delay:7.9s">AI &amp; Data Science Enthusiast</text>
  <text class="role jb" x="90" y="384" font-size="20" fill="#eceef6" opacity="0" style="animation-delay:10.9s">Problem Solver · 150+ DSA</text>

  <!-- Bio -->
  <text class="sgm fu" x="64" y="428" font-size="16" fill="#8d93ab" style="animation-delay:2.5s">Building clean, scalable full-stack apps with Java, Spring Boot &amp; React —</text>
  <text class="sgm fu" x="64" y="450" font-size="16" fill="#8d93ab" style="animation-delay:2.62s">and AI-powered tools that solve real-world problems.</text>

  <!-- Info pills -->
  <g class="fu" style="animation-delay:3.0s">
    <g transform="translate(72,488)">
      <path d="M0-8a6 6 0 0 1 6 6c0 4.5-6 10-6 10s-6-5.5-6-10a6 6 0 0 1 6-6z" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
      <circle cy="-2" r="2" fill="#22d3ee"/>
    </g>
    <text class="jb" x="88" y="493" font-size="14" fill="#8d93ab">Pune, India</text>
  </g>
  <g class="fu" style="animation-delay:3.15s">
    <g transform="translate(220,488)">
      <rect x="-7" y="-5" width="14" height="11" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
      <path d="M-3-5v-2.5h6V-5" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
    </g>
    <text class="jb" x="236" y="493" font-size="14" fill="#8d93ab">B.Tech CSE · Data Science</text>
  </g>
  <g class="fu" style="animation-delay:3.3s">
    <g transform="translate(430,488)">
      <path d="M0-8l2.4 5 5.4.6-4 3.7 1.1 5.4L0 4 -4.9 6.7-3.8 1.3-7.8-2.4l5.4-.6z" fill="none" stroke="#f472b6" stroke-width="1.7" stroke-linejoin="round"/>
    </g>
    <text class="jb" x="446" y="493" font-size="14" fill="#8d93ab">1st Rank · 84.20%</text>
  </g>
</g>

<rect x=".75" y=".75" width="1278.5" height="538.5" rx="25.5" fill="none" stroke="url(#edgeG)" stroke-width="1.5"/>
</svg>
