    <circle cx="870" cy="261" r="6" fill="#BCAE79"/>
    <text class="jb" x="888" y="267" font-size="17" fill="#eceef6">Hibernate</text>
  </g>
  <g class="fu" style="animation-delay:1.17s">
    <rect x="1012" y="235" width="130" height="52" rx="14" fill="#339933" fill-opacity=".12" stroke="#339933" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="1036" cy="261" r="6" fill="#339933"/>
    <text class="jb" x="1054" y="267" font-size="17" fill="#eceef6">Node.js</text>
  </g>

  <!-- Category: FRONTEND -->
  <g class="fu" style="animation-delay:1.24s">
    <rect x="640" y="320" width="6" height="26" rx="3" fill="#fbbf24"/>
    <text class="jbb" x="662" y="340" font-size="16" fill="#fbbf24" letter-spacing="2.5">FRONTEND</text>
  </g>
  <g class="fu" style="animation-delay:1.34s">
    <rect x="640" y="360" width="130" height="52" rx="14" fill="#61DAFB" fill-opacity=".12" stroke="#61DAFB" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="664" cy="386" r="6" fill="#61DAFB"/>
    <text class="jb" x="682" y="392" font-size="17" fill="#eceef6">React</text>
  </g>
  <g class="fu" style="animation-delay:1.41s">
    <rect x="786" y="360" width="170" height="52" rx="14" fill="#7952B3" fill-opacity=".12" stroke="#7952B3" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="810" cy="386" r="6" fill="#7952B3"/>
    <text class="jb" x="828" y="392" font-size="17" fill="#eceef6">Bootstrap</text>
  </g>
  <g class="fu" style="animation-delay:1.48s">
    <rect x="972" y="360" width="160" height="52" rx="14" fill="#06B6D4" fill-opacity=".12" stroke="#06B6D4" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="996" cy="386" r="6" fill="#06B6D4"/>
    <text class="jb" x="1014" y="392" font-size="17" fill="#eceef6">Tailwind</text>
