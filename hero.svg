      <circle cx="1118" cy="96" r="4.5" fill="#6DB33F"/>
      <text class="jb" x="1132" y="102" font-size="13" fill="#eceef6">Spring Boot</text>
    </g>
    <g class="float" style="animation-delay:1s">
